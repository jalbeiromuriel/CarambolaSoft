<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mero Parche · Inicio</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0f19;--txt:#e7eefc;--muted:#8493ad;--cian:#22d3ee;--magenta:#e879f9;--verde:#4ade80;--amarillo:#fbbf24;--rojo:#ff4d5e;--azul:#3b82f6;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;}
  body{background:
      radial-gradient(1200px 700px at 50% 30%,#141d33 0%,transparent 60%),
      linear-gradient(180deg,#0a0e18,#0b0f19);
    color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;overflow:hidden;position:relative;}
  /* rejilla de fondo */
  body::before{content:"";position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px);
    background-size:54px 54px;mask-image:radial-gradient(circle at 50% 40%,#000 40%,transparent 85%);}

  .stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:2;}

  .welcome{font-family:'Orbitron',sans-serif;font-size:clamp(12px,2vw,16px);letter-spacing:10px;color:var(--muted);margin-bottom:6px;}
  .title{font-family:'Orbitron',sans-serif;font-weight:900;line-height:.95;text-align:center;letter-spacing:4px;font-size:clamp(46px,10vw,120px);}
  .title .mero{color:var(--amarillo);text-shadow:0 0 18px rgba(251,191,36,.6),0 0 46px rgba(251,191,36,.3);}
  .title .parche{color:var(--cian);text-shadow:0 0 18px rgba(34,211,238,.7),0 0 46px rgba(34,211,238,.35);}
  .sub{margin-top:10px;font-size:clamp(10px,1.6vw,13px);letter-spacing:6px;color:var(--muted);
    background:linear-gradient(90deg,var(--rojo),var(--amarillo),var(--verde),var(--cian),var(--magenta));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:.9;}

  /* Reto del parche */
  .reto{margin-top:30px;width:min(460px,90vw);border:1px solid var(--magenta);border-radius:22px;padding:22px 24px 26px;text-align:center;
    background:linear-gradient(180deg,rgba(232,121,249,.06),rgba(11,15,25,.5));box-shadow:0 0 40px -12px rgba(232,121,249,.5),inset 0 0 30px rgba(232,121,249,.05);}
  .reto .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--magenta);border-radius:999px;padding:8px 20px;
    font-family:'Orbitron',sans-serif;font-size:clamp(11px,1.6vw,14px);letter-spacing:4px;color:var(--magenta);text-shadow:0 0 12px rgba(232,121,249,.6);}
  .reto .num{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(62px,12vw,104px);line-height:1;margin:14px 0 2px;color:#fff;
    text-shadow:0 0 20px rgba(34,211,238,.5),0 0 44px rgba(34,211,238,.3);}
  .reto .cap{font-size:clamp(11px,1.7vw,14px);letter-spacing:3px;color:var(--muted);}
  .reto .vs{margin-top:18px;font-size:11px;letter-spacing:4px;color:var(--muted);}
  .reto .who{font-family:'Orbitron',sans-serif;font-weight:800;font-size:clamp(22px,4vw,34px);color:var(--magenta);letter-spacing:1px;
    text-shadow:0 0 16px rgba(232,121,249,.55);margin-top:4px;}

  .cta{margin-top:30px;width:min(560px,92vw);cursor:pointer;background:linear-gradient(180deg,rgba(34,211,238,.14),rgba(34,211,238,.03));
    border:2px solid var(--cian);border-radius:18px;color:var(--cian);font-family:'Orbitron',sans-serif;font-weight:800;
    font-size:clamp(18px,3.4vw,30px);letter-spacing:4px;padding:22px 20px;text-shadow:0 0 14px rgba(34,211,238,.6);
    box-shadow:0 0 34px -8px rgba(34,211,238,.6),inset 0 0 26px rgba(34,211,238,.08);animation:pulse 2.2s ease-in-out infinite;transition:transform .08s;}
  .cta:active{transform:scale(.98);}
  @keyframes pulse{50%{box-shadow:0 0 52px -6px rgba(34,211,238,.85),inset 0 0 30px rgba(34,211,238,.14);}}
  .cta2{margin-top:14px;width:min(560px,92vw);cursor:pointer;background:transparent;border:1px solid var(--muted);border-radius:14px;color:var(--muted);font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(12px,2vw,16px);letter-spacing:3px;padding:14px 20px;transition:.15s;}
  .cta2:hover{border-color:var(--amarillo);color:var(--amarillo);}

  /* bolas wireframe */
  .wball{position:absolute;z-index:1;}
  .wball text{font-family:'Orbitron',sans-serif;}
  .b3{width:clamp(140px,20vw,300px);left:-3%;top:44%;color:var(--rojo);filter:drop-shadow(0 0 14px var(--rojo));animation:float 6s ease-in-out infinite;}
  .b9{width:clamp(120px,16vw,240px);right:2%;top:16%;color:var(--amarillo);filter:drop-shadow(0 0 14px var(--amarillo));animation:float 7s ease-in-out infinite .6s;}
  .b2{width:clamp(120px,16vw,240px);right:4%;bottom:12%;color:var(--azul);filter:drop-shadow(0 0 14px var(--azul));animation:float 6.5s ease-in-out infinite .3s;}
  @keyframes float{50%{transform:translateY(-18px);}}
  @media (max-width:760px){.b3,.b9,.b2{opacity:.35;}}

  .foot{position:absolute;bottom:12px;width:100%;text-align:center;font-size:10px;letter-spacing:3px;color:#3d4a63;z-index:2;}
</style>
</head>
<body>

<!-- Bolas decorativas -->
<svg class="wball b3" viewBox="0 0 200 200"><g fill="none" stroke="currentColor" stroke-width="1.4" opacity=".9">
  <circle cx="100" cy="100" r="86"/><ellipse cx="100" cy="100" rx="86" ry="28"/><ellipse cx="100" cy="100" rx="86" ry="56"/>
  <ellipse cx="100" cy="100" rx="28" ry="86"/><ellipse cx="100" cy="100" rx="56" ry="86"/></g>
  <circle cx="100" cy="100" r="32" fill="#0b0f19" stroke="currentColor" stroke-width="1.6"/>
  <text x="100" y="113" text-anchor="middle" fill="currentColor" font-size="38" font-weight="800">3</text></svg>

<svg class="wball b9" viewBox="0 0 200 200"><g fill="none" stroke="currentColor" stroke-width="1.4" opacity=".9">
  <circle cx="100" cy="100" r="86"/><ellipse cx="100" cy="100" rx="86" ry="28"/><ellipse cx="100" cy="100" rx="86" ry="56"/>
  <ellipse cx="100" cy="100" rx="28" ry="86"/><ellipse cx="100" cy="100" rx="56" ry="86"/></g>
  <circle cx="100" cy="100" r="32" fill="#0b0f19" stroke="currentColor" stroke-width="1.6"/>
  <text x="100" y="113" text-anchor="middle" fill="currentColor" font-size="38" font-weight="800">9</text></svg>

<svg class="wball b2" viewBox="0 0 200 200"><g fill="none" stroke="currentColor" stroke-width="1.4" opacity=".9">
  <circle cx="100" cy="100" r="86"/><ellipse cx="100" cy="100" rx="86" ry="28"/><ellipse cx="100" cy="100" rx="86" ry="56"/>
  <ellipse cx="100" cy="100" rx="28" ry="86"/><ellipse cx="100" cy="100" rx="56" ry="86"/></g>
  <circle cx="100" cy="100" r="32" fill="#0b0f19" stroke="currentColor" stroke-width="1.6"/>
  <text x="100" y="113" text-anchor="middle" fill="currentColor" font-size="38" font-weight="800">2</text></svg>

<div class="stage">
  <div class="welcome">BIENVENIDO A</div>
  <h1 class="title"><span class="mero">MERO</span> <span class="parche">PARCHE</span></h1>
  <div class="sub">LICORES &amp; BILLAR · SANTA CRUZ</div>

  <div class="reto">
    <div class="pill">👑 RETO DEL PARCHE 👑</div>
    <div class="num">0</div>
    <div class="cap">CARAMBOLAS — RÉCORD ACTUAL</div>
    <div class="vs">JUGADOR A VENCER</div>
    <div class="who">billarcito</div>
  </div>

  <button class="cta" onclick="location.href='MeroParche_Marcador.html'">¡ TOCÁ AQUÍ PARA JUGAR !</button>
  <button class="cta2" onclick="location.href='MeroParche_Clientes.html'">👥 GESTIONAR CLIENTES</button>
</div>

<div class="foot">© 2026 MERO PARCHE · CARAMBOLASOFT</div>
</body>
</html>
